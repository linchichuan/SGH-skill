name: Public repository bug
description: Report a reproducible code or documentation issue without personal data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This form is only for public repository bugs. Do not submit service requests, phone numbers, medical information, credentials, OAuth tokens, SGH Pass tokens, payment data or call transcripts.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the repository issue using synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: Commit SHA or Skill version
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed personal data, credentials, tokens, phone numbers, medical details, payment information and transcripts.
          required: true
